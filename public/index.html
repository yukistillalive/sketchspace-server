<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketchspace demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    #bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    #canvasId { width: 260px; }
    canvas { border: 1px solid #888; touch-action: none; cursor: crosshair; max-width: 100%; }
    #status { color: #555; }
    #mode { font-weight: 600; padding: 2px 8px; border-radius: 10px; background: #eee; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="create">New canvas</button>
    <label><input id="shared" type="checkbox"> shared</label>
    <span id="mode"></span>
    <input id="canvasId" placeholder="canvas id">
    <button id="join">Join</button>
    <input id="color" type="color" value="#222222">
    <input id="size" type="range" min="1" max="40" value="4">
    <button id="undo" disabled>Undo</button>
    <button id="clear" disabled>Clear</button>
    <span id="status">not connected</span>
  </div>
  <canvas id="board" width="900" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const board = document.getElementById('board');
    const ctx = board.getContext('2d');
    const $ = (id) => document.getElementById(id);
    const setStatus = (t) => { $('status').textContent = t; };

    let canvasId = null;
    let isShared = false;
    let isOwner = false;
    let peers = 0;
    let strokes = []; // what is on the board; redrawn after an undo or a clear

    // The owner token is returned once when a canvas is created; it lets the owner back into
    // the canvas while it is private (solo mode). Kept in localStorage per canvas.
    const tokenKey = (id) => `owner:${id}`;
    const getToken = (id) => { try { return localStorage.getItem(tokenKey(id)); } catch { return null; } };
    const saveToken = (id, t) => { try { localStorage.setItem(tokenKey(id), t); } catch {} };

    // solo = private and just you; collaboration = shared with someone else in it
    function showMode() {
      $('shared').checked = isShared;
      $('shared').disabled = !canvasId || !isOwner; // only the owner can share / unshare
      $('undo').disabled = !canvasId;
      $('clear').disabled = !canvasId || !isOwner; // only the owner can clear
      $('mode').textContent = !canvasId ? '' :
        !isShared ? 'solo mode' :
        peers > 1 ? `collaboration mode (${peers} here)` : 'shared, waiting for others';
    }

    function drawStroke(s) {
      ctx.save();
      ctx.lineCap = ctx.lineJoin = 'round';
      ctx.lineWidth = s.size;
      ctx.strokeStyle = s.color;
      ctx.globalAlpha = s.opacity;
      ctx.beginPath();
      ctx.moveTo(s.path[0].x, s.path[0].y);
      for (const p of s.path.slice(1)) ctx.lineTo(p.x, p.y);
      if (s.path.length === 1) ctx.lineTo(s.path[0].x + 0.01, s.path[0].y); // dot
      ctx.stroke();
      ctx.restore();
    }

    function redraw() {
      ctx.clearRect(0, 0, board.width, board.height);
      strokes.forEach(drawStroke);
    }

    function join(id) {
      const token = getToken(id);
      socket.emit('canvas:join', id, token ? { ownerToken: token } : {}, (res) => {
        if (!res.ok) return setStatus(res.error);
        canvasId = id;
        isShared = res.isShared;
        isOwner = res.isOwner;
        $('canvasId').value = id;
        history.replaceState(null, '', `?canvas=${id}`);
        strokes = res.strokes;
        redraw();
        setStatus(`joined ${id}${isOwner ? ' (owner)' : ''}`);
        showMode();
      });
    }

    $('create').onclick = async () => {
      const r = await fetch('/api/canvas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'demo', isShared: $('shared').checked }),
      });
      const { canvasId: id, ownerToken } = await r.json();
      saveToken(id, ownerToken);
      join(id);
    };
    $('join').onclick = () => join($('canvasId').value.trim());

    // another participant finished a stroke
    socket.on('stroke:added', (s) => { strokes.push(s); drawStroke(s); });
    // a participant undid a stroke, or the owner cleared the canvas
    socket.on('stroke:removed', (id) => { strokes = strokes.filter((s) => s.id !== id); redraw(); });
    socket.on('canvas:cleared', () => { strokes = []; redraw(); });
    socket.on('canvas:peers', (n) => { peers = n; showMode(); });
    // the owner made the canvas private: we were removed from it
    socket.on('canvas:unshared', () => {
      canvasId = null;
      setStatus('the owner made this canvas private');
      showMode();
    });

    // the canvas was deleted: we were removed from it
    socket.on('canvas:deleted', () => {
      canvasId = null;
      setStatus('this canvas was deleted');
      showMode();
    });

    // owner toggles shared / private (solo <-> collaboration)
    $('shared').onchange = async () => {
      const want = $('shared').checked;
      const r = await fetch(`/api/canvas/${canvasId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Owner-Token': getToken(canvasId) || '' },
        body: JSON.stringify({ isShared: want }),
      });
      if (r.ok) isShared = want;
      showMode();
    };
    // undo your latest stroke (button or Ctrl/Cmd+Z); the owner can clear everything
    function undo() {
      if (!canvasId) return;
      socket.emit('stroke:undo', (res) => {
        if (!res.ok) return setStatus(res.error);
        strokes = strokes.filter((s) => s.id !== res.id);
        redraw();
      });
    }
    $('undo').onclick = undo;
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    });
    $('clear').onclick = () => {
      socket.emit('canvas:clear', (res) => {
        if (!res.ok) return setStatus(res.error);
        strokes = [];
        redraw();
      });
    };

    // reconnect (e.g. server restart): rejoin to get missed strokes
    socket.on('connect', () => canvasId && join(canvasId));

    // --- local drawing: collect points, draw immediately, send on pointer-up ---
    let current = null;
    const pos = (e) => {
      const r = board.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (board.width / r.width), y: (e.clientY - r.top) * (board.height / r.height) };
    };

    board.addEventListener('pointerdown', (e) => {
      if (!canvasId) return setStatus('join a canvas first');
      board.setPointerCapture(e.pointerId);
      current = { canvasId, layerId: 'foreground', brush: 'pen', size: +$('size').value,
                  color: $('color').value, opacity: 1, path: [pos(e)] };
    });
    board.addEventListener('pointermove', (e) => {
      if (!current) return;
      current.path.push(pos(e));
      drawStroke({ ...current, path: current.path.slice(-2) }); // draw the newest segment
    });
    const finish = () => {
      if (!current) return;
      const stroke = current;
      current = null;
      drawStroke(stroke);
      strokes.push(stroke);
      socket.emit('stroke:add', stroke, (res) => {
        if (res.ok) return void (stroke.id = res.id); // the id is what undo and other clients refer to
        strokes = strokes.filter((s) => s !== stroke);
        redraw();
        setStatus(res.error);
      });
    };
    board.addEventListener('pointerup', finish);
    board.addEventListener('pointercancel', finish);

    const fromUrl = new URLSearchParams(location.search).get('canvas');
    if (fromUrl) socket.once('connect', () => join(fromUrl));
  </script>
</body>
</html>
