$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 27200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "{{userEmail}}", "password": "newpass456"}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // needs the token from the reset link: see the note in "auth reset password with emailed token"
      if (!pm.collectionVariables.get('resetToken')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200: the new password works for login', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().token).to.be.a('string');
      });
