$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/forgot-password'
order: 20100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "not-an-email"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for an invalid email', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.match(/email/i);
      });
