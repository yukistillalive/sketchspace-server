$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 27100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"token": "{{resetToken}}", "password": "newpass456"}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // needs the token from the reset link: see the note in "auth reset password with emailed token"
      if (!pm.collectionVariables.get('resetToken')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      // To run this and the 3 requests after it: send "auth forgot password", copy the token from the link
      // (.../#/reset-password?token=THIS_PART) in the e-mail (or, without SMTP_URL, in the server's log) into the
      // collection variable resetToken, then send them. While resetToken is empty they are skipped.
      pm.test('200: the new password is set', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql({ ok: true });
      });
