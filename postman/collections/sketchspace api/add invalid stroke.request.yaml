$kind: http-request
method: POST
url: '{{baseUrl}}/api/canvas/{{canvasId}}/strokes'
order: 7800
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Owner-Token
    value: '{{ownerToken}}'
body:
  type: json
  content: |-
    {"layerId":"foreground","brush":"pen","size":4,"color":"#222222","opacity":5,"path":[{"x":1,"y":2}]}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for opacity outside 0..1', () => {
        pm.response.to.have.status(400);
      });
