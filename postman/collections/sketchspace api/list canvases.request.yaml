$kind: http-request
method: GET
url: '{{baseUrl}}/api/canvas'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and contains the new canvas', () => {
        pm.response.to.have.status(200);
        const ids = pm.response.json().map((c) => c._id);
        pm.expect(ids).to.include(pm.collectionVariables.get('canvasId'));
      });
