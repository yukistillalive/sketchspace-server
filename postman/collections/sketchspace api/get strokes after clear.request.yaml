$kind: http-request
method: GET
url: '{{baseUrl}}/api/canvas/{{canvasId}}/strokes'
order: 7930
headers:
  - key: X-Owner-Token
    value: '{{ownerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and no strokes left', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql([]);
      });
