$kind: http-request
method: GET
url: '{{baseUrl}}/api/folders'
order: 26350
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and lists the folder', () => {
        pm.response.to.have.status(200);
        const folders = pm.response.json();
        pm.expect(folders).to.be.an('array');
        const folder = folders.find((f) => f.id === pm.collectionVariables.get('folderId'));
        pm.expect(folder.name).to.eql('Postman folder');
      });
