$kind: http-request
method: PUT
url: '{{baseUrl}}/api/canvas/{{folderCanvasId}}/folder'
order: 26560
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"folderId":123}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 when folderId is not an id or null', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.match(/folderId/);
      });
