$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 27400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"token": "{{resetToken}}", "password": "another789"}
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // needs the token from the reset link: see the note in "auth reset password with emailed token"
      if (!pm.collectionVariables.get('resetToken')) pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400: a reset link works only once', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.match(/not valid/i);
      });
