$kind: http-request
method: POST
url: '{{baseUrl}}/api/canvas/{{claimCanvasId}}/claim'
order: 26860
headers:
  - key: Authorization
    value: 'Bearer {{token2}}'
  - key: X-Owner-Token
    value: '{{claimOwnerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('403 for a canvas that belongs to another account', () => {
        pm.response.to.have.status(403);
        pm.expect(pm.response.json().error).to.match(/owner/i);
      });
