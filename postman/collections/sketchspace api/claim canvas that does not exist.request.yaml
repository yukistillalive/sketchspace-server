$kind: http-request
method: POST
url: '{{baseUrl}}/api/canvas/000000000000000000000000/claim'
order: 26144
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: X-Owner-Token
    value: '{{claimOwnerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 for a canvas that does not exist', () => {
        pm.response.to.have.status(404);
        pm.expect(pm.response.json().error).to.be.a('string');
      });
