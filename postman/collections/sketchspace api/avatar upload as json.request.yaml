$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/me/avatar'
order: 26200
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('415 when the picture is not sent as an image', () => {
        pm.response.to.have.status(415);
        pm.expect(pm.response.json().error).to.be.a('string');
      });
