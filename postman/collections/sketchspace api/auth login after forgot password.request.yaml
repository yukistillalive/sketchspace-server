$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 20400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "{{userEmail}}", "password": "sketch123"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('asking for a reset link does not change the password', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().token).to.be.a('string');
      });
