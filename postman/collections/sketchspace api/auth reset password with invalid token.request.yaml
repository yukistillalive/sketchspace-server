$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 20600
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"token": "not-a-real-token", "password": "newpass456"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for a token that is not a reset token', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.match(/not valid/i);
      });
