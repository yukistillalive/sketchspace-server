$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 15000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "{{userEmail}}", "password": "sketch123", "displayName": "Postman User"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('409 for an email already registered', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error).to.match(/already/i);
      });
