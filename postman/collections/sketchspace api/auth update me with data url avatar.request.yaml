$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/me'
order: 26050
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {"avatarUrl": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and returns the user with the uploaded avatar', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().avatarUrl).to.eql('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==');
      });
