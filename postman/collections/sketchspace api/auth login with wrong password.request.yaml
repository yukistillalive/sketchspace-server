$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 19000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "{{userEmail}}", "password": "wrong-pass1"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 for a wrong password', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error).to.match(/invalid/i);
      });
