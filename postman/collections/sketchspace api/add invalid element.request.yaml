$kind: http-request
method: POST
url: '{{baseUrl}}/api/canvas/{{canvasId}}/elements'
order: 7952
headers:
  - key: Content-Type
    value: 'application/json'
  - key: X-Owner-Token
    value: '{{ownerToken}}'
body:
  type: json
  content: |-
    {"type":"shape","x":10,"y":20,"width":100,"height":50,"rotation":0,"zIndex":1,"shape":"blob","color":null}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for an unknown shape name', () => {
        pm.response.to.have.status(400);
      });
