$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/register'
order: 17000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "weak@example.com", "password": "short", "displayName": "Postman User"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for a weak password', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.match(/password/i);
      });
