$kind: http-request
method: POST
url: '{{baseUrl}}/api/folders'
order: 26250
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"name":"postman FOLDER"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('409 for a name the account already has, ignoring case', () => {
        pm.response.to.have.status(409);
        pm.expect(pm.response.json().error).to.match(/already exists/i);
      });
