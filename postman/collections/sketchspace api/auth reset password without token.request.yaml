$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 20500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"password": "newpass456"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 without a token', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.be.a('string');
      });
