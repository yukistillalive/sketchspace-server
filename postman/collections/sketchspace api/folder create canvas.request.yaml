$kind: http-request
method: POST
url: '{{baseUrl}}/api/canvas'
order: 26150
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"name":"postman folder canvas","isShared":false}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 and returns a canvas owned by the account', () => {
        pm.response.to.have.status(201);
        const id = pm.response.json().canvasId;
        pm.expect(id).to.be.a('string').and.have.length.above(0);
        pm.collectionVariables.set('folderCanvasId', id);
      });
