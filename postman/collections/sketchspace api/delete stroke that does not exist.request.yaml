$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/canvas/{{canvasId}}/strokes/{{strokeId}}'
order: 7944
headers:
  - key: X-Owner-Token
    value: '{{ownerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 once the stroke is gone', () => {
        pm.response.to.have.status(404);
      });
