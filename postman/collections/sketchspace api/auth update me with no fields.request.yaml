$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/me'
order: 25000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 when there is nothing to update', () => {
        pm.response.to.have.status(400);
      });
