$kind: http-request
method: GET
url: '{{baseUrl}}/api/auth/session'
order: 22100
headers:
  - key: Authorization
    value: 'Bearer not-a-real-token'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and user is null for an invalid token', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql({ user: null });
      });
