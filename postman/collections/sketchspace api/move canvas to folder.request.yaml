$kind: http-request
method: PUT
url: '{{baseUrl}}/api/canvas/{{folderCanvasId}}/folder'
order: 26500
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"folderId":"{{folderId}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and ok', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql({ ok: true });
      });
