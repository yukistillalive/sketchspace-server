$kind: http-request
method: POST
url: '{{baseUrl}}/api/canvas'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"isShared":"yes"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for a non-boolean isShared', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json()).to.have.property('error');
      });
