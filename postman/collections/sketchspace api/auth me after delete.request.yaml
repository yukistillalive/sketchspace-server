$kind: http-request
method: GET
url: '{{baseUrl}}/api/users/me'
order: 30000
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 once the account is deleted', () => {
        pm.response.to.have.status(401);
      });
