$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 20000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 when email and password are missing', () => {
        pm.response.to.have.status(400);
      });
