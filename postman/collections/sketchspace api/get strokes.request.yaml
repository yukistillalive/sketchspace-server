$kind: http-request
method: GET
url: '{{baseUrl}}/api/canvas/{{canvasId}}/strokes'
order: 7900
headers:
  - key: X-Owner-Token
    value: '{{ownerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and one stroke in the socket wire shape', () => {
        pm.response.to.have.status(200);
        const strokes = pm.response.json();
        pm.expect(strokes).to.have.length(1);
        pm.expect(strokes[0]).to.include.all.keys('id', 'canvasId', 'layerId', 'brush', 'size', 'color', 'opacity', 'path');
        pm.expect(strokes[0]).to.not.have.any.keys('_id', 'createdAt');
      });
