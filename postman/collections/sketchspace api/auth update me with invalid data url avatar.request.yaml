$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/me'
order: 26100
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {"avatarUrl": "data:image/gif;base64,R0lGODlhAQABAAAAACw="}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for an avatar data URL that is not png/jpeg/webp', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.include('data:image/png');
      });
