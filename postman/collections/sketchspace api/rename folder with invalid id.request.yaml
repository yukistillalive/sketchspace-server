$kind: http-request
method: PUT
url: '{{baseUrl}}/api/folders/not-an-id'
order: 26450
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"name":"Whatever"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 for a malformed id', () => {
        pm.response.to.have.status(400);
        pm.expect(pm.response.json().error).to.match(/invalid/i);
      });
