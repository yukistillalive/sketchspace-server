$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/forgot-password'
order: 20300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "{{userEmail}}"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and exactly the same answer as for an unknown address', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql({ ok: true });
      });
      pm.test('the answer does not contain a token or a link', () => {
        pm.expect(pm.response.text()).to.not.match(/token|reset-password/i);
      });
