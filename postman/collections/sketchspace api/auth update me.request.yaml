$kind: http-request
method: PUT
url: '{{baseUrl}}/api/users/me'
order: 23000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {"displayName": "Renamed User"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and returns the updated user', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().displayName).to.eql('Renamed User');
      });
