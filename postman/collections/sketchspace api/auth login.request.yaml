$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/login'
order: 18000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "{{userEmail}}", "password": "sketch123"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and returns a token', () => {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.token).to.be.a('string').and.have.length.above(20);
        pm.collectionVariables.set('token', body.token);
      });
