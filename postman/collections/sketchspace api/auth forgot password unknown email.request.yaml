$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/forgot-password'
order: 20200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"email": "nobody-here-{{$timestamp}}@example.com"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and { ok: true }, so the form does not show who has an account', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql({ ok: true });
      });
