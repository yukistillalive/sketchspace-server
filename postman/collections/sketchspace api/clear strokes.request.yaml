$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/canvas/{{canvasId}}/strokes'
order: 7920
headers:
  - key: X-Owner-Token
    value: '{{ownerToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and reports how many strokes were removed', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json()).to.eql({ ok: true, removed: 1 });
      });
