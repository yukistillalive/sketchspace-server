$kind: http-request
method: GET
url: '{{baseUrl}}/api/canvas/mine'
order: 26920
headers:
  - key: Authorization
    value: 'Bearer {{token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200, the canvas is kept and its folderId is null', () => {
        pm.response.to.have.status(200);
        const canvas = pm.response.json().find((c) => c._id === pm.collectionVariables.get('folderCanvasId'));
        pm.expect(canvas, 'the canvas still exists').to.be.an('object');
        pm.expect(canvas.folderId).to.eql(null);
      });
