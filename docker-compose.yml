# Runs the backend and its MongoDB. Settings come from .env (copy .env.example).
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # for inspecting the data from this machine only (127.0.0.1); never expose it publicly
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # no ports: only Caddy reaches the backend, over the internal network
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # uploaded profile pictures
      - uploads-data:/app/uploads
    environment:
      MONGODB_URI: mongodb://mongo:27017/sketch-space
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HTTPS in front of the backend. Gets and renews its certificate by itself.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  mongo-data:
  caddy-data:
  uploads-data:
